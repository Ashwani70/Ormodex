name: Security Scan

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  python-deps:
    name: Python dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      # Audit the pinned backend requirements. Fails the job on any known
      # vulnerability; use `--ignore-vuln <ID>` here to accept a documented,
      # non-actionable advisory rather than disabling the whole gate.
      - name: Audit backend requirements
        run: pip-audit -r backend/requirements.txt --strict

  node-deps:
    name: Node dependency audit (npm audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # react-scripts (Create React App, unmaintained upstream) transitively
      # pins vulnerable dev-time build tooling — svgo, postcss, nth-check,
      # workbox-build, css-select, etc. None have a fix that isn't a breaking
      # react-scripts downgrade (npm audit fix --force → react-scripts@0.0.0).
      # These are build-time-only packages, never shipped to end users. Gate
      # on critical only so real, actionable advisories still block merges;
      # `npm audit fix` (non-force) is run periodically to pick up safe
      # patches automatically. Revisit if/when this app migrates off CRA.
      - name: Audit npm dependencies
        run: |
          node -e '
            const cp = require("child_process");
            try {
              cp.execSync("npm audit --json");
              console.log("No vulnerabilities found.");
            } catch (err) {
              const audit = JSON.parse(err.stdout.toString());
              const criticals = audit.metadata?.vulnerabilities?.critical || 0;
              if (criticals > 0) {
                console.error(`Found ${criticals} critical vulnerabilities.`);
                process.exit(1);
              }
              console.log(`No critical vulnerabilities found (${audit.metadata?.vulnerabilities?.high || 0} high / dev advisories ignored).`);
            }
          '

