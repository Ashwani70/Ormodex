name: Security Scan

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  python-deps:
    name: Python dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      # Audit the pinned backend requirements. Fails the job on any known
      # vulnerability; use `--ignore-vuln <ID>` here to accept a documented,
      # non-actionable advisory rather than disabling the whole gate.
      - name: Audit backend requirements
        run: pip-audit -r backend/requirements.txt --strict

  node-deps:
    name: Node dependency audit (npm audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Fail only on high/critical so transient low/moderate advisories don't
      # block merges. Raise to `--audit-level=moderate` once the tree is clean.
      - name: Audit npm dependencies
        run: npm audit --audit-level=high
