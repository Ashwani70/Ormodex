name: Deploy Production

# Tests → build check → run DB migrations. Runs on every push to main.
#
# DEPLOYS ARE NOT DONE HERE: Render (backend, via render.yaml Blueprint) and
# Vercel (frontend + marketing, via their Git integrations) each auto-deploy
# on push to main. This workflow's job is everything the platforms don't do:
# gate on the test suite and apply Alembic migrations to Supabase.
#
# Required repository secrets (Settings → Secrets and variables → Actions → Secrets):
#   DATABASE_URL           — REQUIRED. Same production Supabase pooler URL set in
#                            Render's service env vars, used here ONLY to run
#                            the migration step. Without this secret the
#                            `migrate` job fails fast (see its "Verify required
#                            secrets are configured" step) instead of falling
#                            through to alembic/env.py, which itself also
#                            refuses to guess a database — no secret, no
#                            migration, ever.
#                            Format: postgresql://postgres.<ref>:<password>@aws-1-<region>.pooler.supabase.com:6543/postgres
#                            Get it from: Supabase dashboard → Connect →
#                            "Transaction pooler", port 6543 — NOT the direct
#                            :5432 host, which is IPv6-only and unreachable
#                            from GitHub-hosted runners.
#
# No other secrets are read by this workflow. SUPABASE_*, OPENAI_API_KEY, etc.
# are runtime app config (Render service env vars, see backend/.env.example) —
# CI never touches them because it only runs schema migrations, not the app.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Tests gate migrations — a failing suite never touches the database ───
  test-backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gravity_erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run database migrations
        env:
          DATABASE_URL: "postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/gravity_erp"
        run: alembic upgrade head
      - name: Run test suite
        # NOTE: this repo's own audit notes document pre-existing order-
        # dependent test pollution in the full suite (see project memory) —
        # not a regression introduced by this workflow. If a flaky ordering
        # failure blocks a real deploy, re-run this job before assuming the
        # change under test is at fault.
        env:
          DATABASE_URL: "postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/gravity_erp"
          JWT_SECRET: "cmTIQGVgKtDWRF00t6qgtQPYjAeCV2GKCTEGJSjxN7T"
          BYPASS_RATE_LIMIT: "true"
        run: pytest -q

  test-frontend:
    name: Frontend build check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Production build
        # Build check only — the deployed bundle is built by Vercel, which
        # injects the real REACT_APP_BACKEND_URL from its own project env.
        run: npm run build
        env:
          CI: "false"
      - name: Assert PWA assets exist
        run: |
          test -f build/service-worker.js
          test -f build/manifest.json
          node -e "JSON.parse(require('fs').readFileSync('build/manifest.json','utf8'))"

  # ── Migrations run once, gated on both test jobs ─────────────────────────
  migrate:
    name: Run database migrations
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      # Checkout must come first: this job defaults working-directory to
      # backend/, which doesn't exist until checkout — a step running before
      # it dies with "No such file or directory" instead of its real message.
      - uses: actions/checkout@v4
      - name: Verify required secrets are configured
        run: |
          if [ -z "${{ secrets.DATABASE_URL }}" ]; then
            echo "::error::DATABASE_URL repository secret is not set."
            echo "Add it under Settings -> Secrets and variables -> Actions -> Secrets."
            echo "Use the Supabase TRANSACTION POOLER connection string (port 6543,"
            echo "host aws-*.pooler.supabase.com) — see backend/.env.example for the format."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Alembic upgrade head
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: alembic upgrade head
