name: Deploy Production

# Tests → build check → run DB migrations → verify deployed backend health →
# notify. Runs on every push to main.
#
# DEPLOYS ARE NOT DONE HERE: Render (backend, via render.yaml Blueprint) and
# Vercel (frontend + marketing, via their Git integrations) each auto-deploy
# on push to main. This workflow's job is everything the platforms don't do:
# gate on the test suite, apply Alembic migrations to Supabase, then smoke-
# check the deployed backend's health endpoint.
#
# Required repository secrets (Settings → Secrets and variables → Actions → Secrets):
#   DATABASE_URL           — REQUIRED. Same production Supabase pooler URL set in
#                            Render's service env vars, used here ONLY to run
#                            the migration step. Without this secret the
#                            `migrate` job fails fast (see its "Verify required
#                            secrets are configured" step) instead of falling
#                            through to alembic/env.py, which itself also
#                            refuses to guess a database — no secret, no
#                            migration, ever.
#                            Format: postgresql://postgres.<ref>:<password>@aws-1-<region>.pooler.supabase.com:6543/postgres
#                            Get it from: Supabase dashboard → Connect →
#                            "Transaction pooler", port 6543 — NOT the direct
#                            :5432 host, which is IPv6-only and unreachable
#                            from GitHub-hosted runners.
#   SLACK_WEBHOOK_URL       — optional; omit to skip the notify step silently.
#
# No other secrets are read by this workflow. SUPABASE_*, OPENAI_API_KEY, etc.
# are runtime app config (Render service env vars, see backend/.env.example) —
# CI never touches them because it only runs schema migrations, not the app.
#
# Required repository variable (Settings → Secrets and variables → Actions → Variables):
#   PRODUCTION_API_URL      — the Render backend's public URL, e.g.
#                             https://gravity-erp-backend.onrender.com or your
#                             custom API domain (no trailing slash).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Tests gate everything else — a failing suite never reaches deploy ────
  test-backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gravity_erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run database migrations
        env:
          DATABASE_URL: "postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/gravity_erp"
        run: alembic upgrade head
      - name: Run test suite
        # NOTE: this repo's own audit notes document pre-existing order-
        # dependent test pollution in the full suite (see project memory) —
        # not a regression introduced by this workflow. If a flaky ordering
        # failure blocks a real deploy, re-run this job before assuming the
        # change under test is at fault.
        env:
          DATABASE_URL: "postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/gravity_erp"
          JWT_SECRET: "cmTIQGVgKtDWRF00t6qgtQPYjAeCV2GKCTEGJSjxN7T"
          BYPASS_RATE_LIMIT: "true"
        run: pytest -q

  test-frontend:
    name: Frontend build check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
        env:
          CI: "false"
          REACT_APP_BACKEND_URL: ${{ vars.PRODUCTION_API_URL }}
      - name: Assert PWA assets exist
        run: |
          test -f build/service-worker.js
          test -f build/manifest.json
          node -e "JSON.parse(require('fs').readFileSync('build/manifest.json','utf8'))"

  # ── Migrations run once, before either service redeploys ─────────────────
  migrate:
    name: Run database migrations
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      # Checkout must come first: this job defaults working-directory to
      # backend/, which doesn't exist until checkout — a step running before
      # it dies with "No such file or directory" instead of its real message.
      - uses: actions/checkout@v4
      - name: Verify required secrets are configured
        run: |
          if [ -z "${{ secrets.DATABASE_URL }}" ]; then
            echo "::error::DATABASE_URL repository secret is not set."
            echo "Add it under Settings -> Secrets and variables -> Actions -> Secrets."
            echo "Use the Supabase TRANSACTION POOLER connection string (port 6543,"
            echo "host aws-*.pooler.supabase.com) — see backend/.env.example for the format."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Alembic upgrade head
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: alembic upgrade head

  # ── Post-deploy smoke check + notification ────────────────────────────────
  # Render deploys the backend in parallel with this workflow (both trigger on
  # the same push), so this job waits until the DEPLOYED service is up AND its
  # database round-trip works (/health/ready — stricter than the liveness
  # probe Render itself gates on).
  verify-and-notify:
    name: Verify deploy + notify
    needs: migrate
    runs-on: ubuntu-latest
    steps:
      - name: Wait for backend readiness
        env:
          API_URL: ${{ vars.PRODUCTION_API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "::error::PRODUCTION_API_URL repository variable is not set."
            echo "Add it under Settings -> Secrets and variables -> Actions -> Variables"
            echo "(the Render backend URL, e.g. https://gravity-erp-backend.onrender.com)."
            exit 1
          fi
          for i in $(seq 1 40); do
            if curl -sf "$API_URL/health/ready" | grep -qi '"status":\s*"ok"'; then
              echo "Backend ready (DB round-trip ok)"
              exit 0
            fi
            echo "Waiting for backend readiness ($i/40)…"
            sleep 15
          done
          echo "::error::Backend did not report ready within 10 minutes of push"
          exit 1

      - name: Notify Slack — success
        if: success()
        run: |
          if [ -z "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            echo "No SLACK_WEBHOOK_URL configured — skipping notification."
            exit 0
          fi
          curl -sf -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"✅ Ormodex ERP deployed successfully — commit ${{ github.sha }} by ${{ github.actor }}\"}" \
            "${{ secrets.SLACK_WEBHOOK_URL }}"

      - name: Notify Slack — failure
        if: failure()
        run: |
          if [ -z "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            echo "No SLACK_WEBHOOK_URL configured — skipping notification."
            exit 0
          fi
          curl -sf -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"❌ Ormodex ERP deploy FAILED — commit ${{ github.sha }} by ${{ github.actor }}. Check the Actions run.\"}" \
            "${{ secrets.SLACK_WEBHOOK_URL }}"
