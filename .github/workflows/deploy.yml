name: Deploy Production

# Tests → build → run DB migrations → deploy backend + frontend to Railway →
# notify. Runs on every push to main; migrations run BEFORE the new backend
# image goes live so a deploy never serves against a schema it doesn't expect.
#
# Required repository secrets (Settings → Secrets and variables → Actions → Secrets):
#   DATABASE_URL           — REQUIRED. Same production Supabase pooler URL set in
#                            Railway's backend service variables, used here ONLY to
#                            run the migration step before the new image is live.
#                            Without this secret the `migrate` job fails fast (see
#                            its "Verify required secrets are configured" step)
#                            instead of falling through to alembic/env.py, which
#                            itself also refuses to guess a database — no secret,
#                            no migration, ever.
#                            Format: postgresql://postgres.<ref>:<password>@aws-0-<region>.pooler.supabase.com:6543/postgres
#                            Get it from: Supabase dashboard → Project Settings →
#                            Database → Connection string → URI (choose "Transaction
#                            pooler", port 6543 — NOT the direct :5432 host, which is
#                            IPv6-only and unreachable from GitHub-hosted runners).
#   RAILWAY_TOKEN          — REQUIRED for deploy-backend/deploy-frontend. Railway
#                            account/project token: railway.app/account/tokens.
#   SLACK_WEBHOOK_URL       — optional; omit to skip the notify step silently.
#
# No other secrets are read by this workflow. SUPABASE_ANON_KEY,
# SUPABASE_SERVICE_ROLE_KEY, OPENAI_API_KEY, etc. are runtime app config
# (Railway service variables, see backend/.env.example) — CI never touches
# them because it only runs schema migrations, not the app itself.
#
# Required repository variable (Settings → Secrets and variables → Actions → Variables):
#   PRODUCTION_API_URL      — e.g. https://api.mycompany.com (no trailing slash).
#                             Not a secret, but centralized here so it's a one-
#                             line edit instead of hunting through the workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Tests gate everything else — a failing suite never reaches deploy ────
  test-backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gravity_erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run database migrations
        env:
          DATABASE_URL: "postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/gravity_erp"
        run: alembic upgrade head
      - name: Run test suite
        # NOTE: this repo's own audit notes document pre-existing order-
        # dependent test pollution in the full suite (see project memory) —
        # not a regression introduced by this workflow. If a flaky ordering
        # failure blocks a real deploy, re-run this job before assuming the
        # change under test is at fault.
        env:
          DATABASE_URL: "postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/gravity_erp"
          JWT_SECRET: "cmTIQGVgKtDWRF00t6qgtQPYjAeCV2GKCTEGJSjxN7T"
          BYPASS_RATE_LIMIT: "true"
        run: pytest -q

  test-frontend:
    name: Frontend build check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
        env:
          CI: "false"
          REACT_APP_BACKEND_URL: ${{ vars.PRODUCTION_API_URL }}
      - name: Assert PWA assets exist
        run: |
          test -f build/service-worker.js
          test -f build/manifest.json
          node -e "JSON.parse(require('fs').readFileSync('build/manifest.json','utf8'))"

  # ── Migrations run once, before either service redeploys ─────────────────
  migrate:
    name: Run database migrations
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      # Checkout must come first: this job defaults working-directory to
      # backend/, which doesn't exist until checkout — a step running before
      # it dies with "No such file or directory" instead of its real message.
      - uses: actions/checkout@v4
      - name: Verify required secrets are configured
        run: |
          if [ -z "${{ secrets.DATABASE_URL }}" ]; then
            echo "::error::DATABASE_URL repository secret is not set."
            echo "Add it under Settings -> Secrets and variables -> Actions -> Secrets."
            echo "Use the Supabase TRANSACTION POOLER connection string (port 6543,"
            echo "host aws-*.pooler.supabase.com) — see backend/.env.example for the format."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Alembic upgrade head
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: alembic upgrade head

  deploy-backend:
    name: Deploy backend (Railway)
    needs: migrate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Deploy backend service
        working-directory: backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service backend --detach

  deploy-frontend:
    name: Deploy frontend (Railway)
    needs: migrate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Deploy frontend service
        working-directory: frontend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service frontend --detach

  # ── Post-deploy smoke check + notification ────────────────────────────────
  verify-and-notify:
    name: Verify deploy + notify
    needs: [deploy-backend, deploy-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Wait for backend health check
        env:
          API_URL: ${{ vars.PRODUCTION_API_URL }}
        run: |
          for i in $(seq 1 20); do
            if curl -sf "$API_URL/health" | grep -qi '"status":\s*"ok"'; then
              echo "Backend healthy"
              exit 0
            fi
            echo "Waiting for backend to come up ($i/20)…"
            sleep 15
          done
          echo "::error::Backend did not report healthy within 5 minutes of deploy"
          exit 1

      - name: Notify Slack — success
        if: success()
        run: |
          if [ -z "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            echo "No SLACK_WEBHOOK_URL configured — skipping notification."
            exit 0
          fi
          curl -sf -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"✅ Ormodex ERP deployed successfully — commit ${{ github.sha }} by ${{ github.actor }}\"}" \
            "${{ secrets.SLACK_WEBHOOK_URL }}"

      - name: Notify Slack — failure
        if: failure()
        run: |
          if [ -z "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            echo "No SLACK_WEBHOOK_URL configured — skipping notification."
            exit 0
          fi
          curl -sf -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"❌ Ormodex ERP deploy FAILED — commit ${{ github.sha }} by ${{ github.actor }}. Check the Actions run.\"}" \
            "${{ secrets.SLACK_WEBHOOK_URL }}"
