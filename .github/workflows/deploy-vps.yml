name: Deploy to Hostinger VPS

# Runs the existing test gate (mirrors deploy.yml's jobs) then SSHes into the
# VPS and runs deploy/deploy.sh, which pulls, installs deps, migrates,
# rebuilds the frontend, and restarts the backend service.
#
# This workflow is for the self-managed Hostinger VPS path
# (docs/HOSTINGER_VPS_DEPLOYMENT_GUIDE.md). If you're still on Railway/Vercel
# (docs/PRODUCTION_DEPLOYMENT_GUIDE.md), that path auto-deploys via each
# platform's own Git integration and does NOT use this workflow — disable
# whichever path you're not using so you don't deploy the same push twice.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   VPS_HOST        - server IP or hostname (e.g. 187.127.219.89)
#   VPS_SSH_USER     - deploy user, e.g. erpapp
#   VPS_SSH_KEY      - private key (ed25519) for erpapp, matching a public
#                      key already in erpapp's ~/.ssh/authorized_keys
#   VPS_SSH_PORT     - optional, defaults to 22
#   DATABASE_URL     - same Supabase pooler URL, used only to gate migrations
#                      in the test-backend job (same as deploy.yml)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-vps-production
  cancel-in-progress: false

jobs:
  test-backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gravity_erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run database migrations
        env:
          DATABASE_URL: "postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/gravity_erp"
        run: alembic upgrade head
      - name: Run test suite
        env:
          DATABASE_URL: "postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/gravity_erp"
          JWT_SECRET: "ci-only-secret-not-for-production-use"
          BYPASS_RATE_LIMIT: "true"
        run: pytest -q

  test-frontend:
    name: Frontend build check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Production build
        run: npm run build
        env:
          CI: "false"

  deploy:
    name: Deploy to VPS
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Verify required secrets are configured
        run: |
          missing=()
          [[ -z "${{ secrets.VPS_HOST }}" ]] && missing+=("VPS_HOST")
          [[ -z "${{ secrets.VPS_SSH_USER }}" ]] && missing+=("VPS_SSH_USER")
          [[ -z "${{ secrets.VPS_SSH_KEY }}" ]] && missing+=("VPS_SSH_KEY")
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::Missing repository secrets: ${missing[*]}"
            exit 1
          fi
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          REPO_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          timeout: 60s
          command_timeout: 15m
          envs: REPO_URL
          script: |
            set -euo pipefail

            APP_ROOT="/var/www/erp"

            # Bootstrap: /var/www/erp is normally cloned once by hand (see
            # docs/HOSTINGER_VPS_DEPLOYMENT_GUIDE.md step 5). If that step was
            # skipped, or the directory was wiped/reset, deploy.sh itself can't
            # help — it lives *inside* the clone it's supposed to update. This
            # makes a first-time or drifted VPS self-heal instead of failing
            # with "deploy.sh: No such file or directory" forever.
            if [[ ! -d "$APP_ROOT/.git" ]]; then
              echo "== $APP_ROOT is not a git clone yet — bootstrapping =="
              # erpapp's sudo grant (guide step 4) is scoped to exactly four
              # systemctl/nginx commands — no mkdir/chown — so this only works
              # (by design) when deploy/setup_server.sh already created and
              # chowned $APP_ROOT to erpapp (its step 4). Don't sudo here: a
              # non-interactive SSH session would just hang on a password
              # prompt it can never answer instead of failing fast.
              if [[ ! -d "$APP_ROOT" ]]; then
                echo "::error::$APP_ROOT doesn't exist at all. Run deploy/setup_server.sh on the VPS first (see docs/HOSTINGER_VPS_DEPLOYMENT_GUIDE.md steps 1-4) — it creates and owns this directory for erpapp." >&2
                exit 1
              fi
              if [[ ! -w "$APP_ROOT" ]]; then
                echo "::error::$APP_ROOT exists but isn't writable by $(whoami). Check its ownership (should be erpapp:erpapp — see deploy/setup_server.sh step 4)." >&2
                exit 1
              fi
              if [[ -z "$(ls -A "$APP_ROOT" 2>/dev/null)" ]]; then
                git clone "$REPO_URL" "$APP_ROOT"
              else
                echo "::error::$APP_ROOT exists, is not a git repo, and is not empty — refusing to clone over it. Inspect it manually on the VPS (see docs/HOSTINGER_VPS_DEPLOYMENT_GUIDE.md step 5)." >&2
                exit 1
              fi
              echo "== First-time clone complete =="

              # deploy.sh assumes backend/.env + frontend/.env already exist
              # (it never writes secrets — see its own header comment) and
              # that erp-backend.service is already installed. Those are the
              # manual, one-time steps in docs/HOSTINGER_VPS_DEPLOYMENT_GUIDE.md
              # (steps 6-9) — check for them now and fail with a clear pointer
              # rather than letting deploy.sh die confusingly inside alembic
              # or systemctl.
              missing_setup=()
              [[ -f "$APP_ROOT/backend/.env" ]] || missing_setup+=("backend/.env (guide step 6)")
              [[ -f "$APP_ROOT/frontend/.env" ]] || missing_setup+=("frontend/.env (guide step 7)")
              systemctl list-unit-files erp-backend.service >/dev/null 2>&1 || missing_setup+=("erp-backend.service not installed (guide step 8)")
              if [[ ${#missing_setup[@]} -gt 0 ]]; then
                echo "::error::First-time VPS setup is incomplete. This looks like a brand-new clone with the following steps from docs/HOSTINGER_VPS_DEPLOYMENT_GUIDE.md still needed: ${missing_setup[*]}. Complete those manually over SSH once, then re-run this workflow." >&2
                exit 1
              fi
            fi

            bash "$APP_ROOT/deploy/deploy.sh"
