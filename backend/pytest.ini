[pytest]
asyncio_mode = strict
# One event loop for the whole pytest session instead of a fresh one per
# @pytest.mark.asyncio test. The data layer's async engine/connection pool is
# a module-level singleton bound to whichever loop first used it; a per-test
# loop that opens and closes rapidly leaves pending asyncpg protocol callbacks
# scheduled against loops that no longer exist, which later blow up as
# "RuntimeError: Event loop is closed" in an unrelated asyncio.run()-based
# test (see tests/conftest.py's _TEST_LOOP for the same fix applied there).
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
