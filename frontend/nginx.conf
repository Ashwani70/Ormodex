# Ormodex ERP — frontend static file serving (inside the Docker image).
# Railway terminates TLS at its edge and proxies plain HTTP to this container
# on port 8080 — see docs/DEPLOYMENT_GUIDE.md for the domain/SSL setup.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip — Brotli isn't in the stock nginx:alpine image; Railway's edge
    # (and most CDNs in front of it) already applies Brotli/gzip on top of
    # this for browsers that support it, so this is the origin-level layer.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/manifest+json image/svg+xml;

    # Defense-in-depth alongside the backend's own security_headers middleware
    # (server.py) — the frontend origin should carry these regardless of what
    # any CDN in front of it does.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(self)" always;

    # ── Immutable, content-hashed build assets — cache for a year ──────────
    # CRA fingerprints filenames (main.<hash>.js), so a new deploy always ships
    # new filenames; there is never a "stale asset" risk from caching these hard.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── PWA files — must NEVER be far-future cached ────────────────────────
    # The service worker's own update check relies on the browser re-fetching
    # service-worker.js periodically; a long Cache-Control here would trap
    # users on an old worker/cache version indefinitely.
    location = /service-worker.js {
        add_header Cache-Control "no-cache";
        expires off;
    }
    location = /manifest.json {
        add_header Cache-Control "no-cache";
        expires off;
    }

    # ── SPA fallback ────────────────────────────────────────────────────────
    # Any path not matching a real static file goes to index.html so React
    # Router's client-side routes (e.g. /invoices, /purchase-orders) work on
    # a hard refresh / direct link, not just client-side navigation.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Container healthcheck target (see Dockerfile HEALTHCHECK).
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
