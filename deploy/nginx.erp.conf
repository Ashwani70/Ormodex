# Ormodex ERP — Nginx site config for a self-managed Hostinger VPS.
#
# Differs from frontend/nginx.conf (which runs *inside* the frontend's Docker
# image on Railway, port 8080, no TLS). This file is the HOST Nginx: it
# terminates TLS, serves the CRA build directly from disk, and reverse-proxies
# /api to the FastAPI systemd service on 127.0.0.1:8001.
#
# Install: copy to /etc/nginx/sites-available/erp.conf, symlink into
# sites-enabled, then run certbot (see docs/HOSTINGER_VPS_DEPLOYMENT_GUIDE.md).
# Certbot will rewrite the server{} blocks below to add ssl_certificate lines
# and an HTTP->HTTPS redirect — the file below is the PRE-certbot version.

# ── Rate limiting zones (shared across server blocks) ──────────────────────
limit_req_zone $binary_remote_addr zone=erp_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=erp_login:10m rate=5r/m;

# Replace erp.yourdomain.com / ormodex.com with your real domain before deploying.
upstream erp_backend {
    # 127.0.0.1 only — FastAPI never listens on a public interface directly;
    # Nginx is the only thing allowed to reach it (see systemd unit + UFW).
    server 127.0.0.1:8001 fail_timeout=0;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name ormodex.com www.ormodex.com api.ormodex.com erp.yourdomain.com;

    # Certbot's HTTP-01 challenge needs plain HTTP to keep working even after
    # SSL is on (renewals reuse this path) — everything else gets redirected.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ormodex.com www.ormodex.com api.ormodex.com erp.yourdomain.com;

    # ssl_certificate / ssl_certificate_key are added here by
    # `certbot --nginx` (see deployment guide, step 10). Do not hardcode
    # paths before certbot has actually issued the certificate.

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    client_max_body_size 25m;

    # ── Security headers (defense-in-depth alongside server.py's own) ──────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(self)" always;

    root /var/www/erp/Ormodex/frontend/build;
    index index.html;

    # ── gzip ─────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/manifest+json image/svg+xml font/woff2;

    # ── Immutable, content-hashed CRA build assets ──────────────────────────
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── PWA files must never be far-future cached ───────────────────────────
    location = /service-worker.js {
        add_header Cache-Control "no-cache";
        expires off;
    }
    location = /manifest.json {
        add_header Cache-Control "no-cache";
        expires off;
    }

    # ── API reverse proxy → FastAPI (systemd service on 127.0.0.1:8001) ───
    location /api/auth/login {
        limit_req zone=erp_login burst=5 nodelay;
        proxy_pass http://erp_backend;
        include /etc/nginx/proxy_params_erp.conf;
    }

    location /api/ {
        limit_req zone=erp_api burst=40 nodelay;
        proxy_pass http://erp_backend;
        include /etc/nginx/proxy_params_erp.conf;
    }

    # Backend health checks — not behind /api, proxy directly.
    location = /health {
        proxy_pass http://erp_backend/health;
        access_log off;
    }

    # ── SPA fallback ─────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
