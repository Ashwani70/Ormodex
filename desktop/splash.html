<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Ormodex ERP</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #070912;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    color: #e2e8f0;
    -webkit-user-select: none; user-select: none;
  }
  .wrap {
    height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px;
  }
  .logo {
    width: 72px; height: 72px; border-radius: 18px;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 28px; color: #fff;
    box-shadow: 0 8px 30px rgba(99, 102, 241, 0.45);
  }
  .name { font-size: 16px; font-weight: 600; letter-spacing: 0.02em; }
  .status { font-size: 12.5px; color: #94a3b8; display: flex; align-items: center; gap: 8px; min-height: 18px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #6366f1; animation: pulse 1.1s ease-in-out infinite; }
  .dot.offline { background: #f59e0b; animation: none; }
  .dot.online { background: #22c55e; animation: none; }
  .dot.starting-local { background: #6366f1; animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
  .bar { width: 220px; height: 3px; border-radius: 2px; background: #1e293b; overflow: hidden; }
  .bar > div { width: 40%; height: 100%; background: #6366f1; animation: slide 1.2s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(340%); } }
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo">O</div>
    <div class="name">Ormodex ERP</div>
    <div class="status"><span class="dot" id="dot"></span><span id="statusText">Connecting to your server…</span></div>
    <div class="bar"><div></div></div>
  </div>
  <script>
    window.splashBridge.onStatus((status) => {
      const dot = document.getElementById("dot");
      const text = document.getElementById("statusText");
      if (status === "online") {
        dot.className = "dot online";
        text.textContent = "Connected — loading Ormodex ERP…";
      } else if (status === "starting-local") {
        dot.className = "dot starting-local";
        text.textContent = "Starting local database…";
      } else {
        dot.className = "dot offline";
        text.textContent = "Offline — you can still browse cached screens once loaded.";
      }
    });
  </script>
</body>
</html>
